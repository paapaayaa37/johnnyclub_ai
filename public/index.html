<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>JohnnyClub Neuro</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #17181a;
    --panel: #1c1d20;
    --text: var(--tg-theme-text-color, #e4e4e6);
    --hint: var(--tg-theme-hint-color, #7a7b80);
    --link: var(--tg-theme-link-color, #9a9ba0);
    --button: var(--tg-theme-button-color, #3a3b3f);
    --button-text: var(--tg-theme-button-text-color, #eaeaea);
    --secondary-bg: #232427;
    --border: #2c2d30;
    --accent: #55565c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  #app {
    display: flex; flex-direction: column; height: 100vh; position: relative;
  }
  #header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 10px; font-weight: 500; font-size: 15px;
    letter-spacing: 0.02em;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  #header .headerTitle { flex: 1; text-align: center; color: var(--text); text-transform: uppercase; font-size: 13px; letter-spacing: 0.08em; }
  .iconBtn {
    background: none; border: none; color: var(--hint); font-size: 15px;
    padding: 6px 10px; cursor: pointer; line-height: 1;
    font-family: inherit;
  }
  .iconBtn:hover { color: var(--text); }
  #messages {
    flex: 1; overflow-y: auto; padding: 14px 12px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .msg {
    max-width: 80%; padding: 10px 14px; border-radius: 4px;
    line-height: 1.45; font-size: 14.5px; white-space: pre-wrap; word-wrap: break-word;
    border: 1px solid var(--border);
  }
  .msg.user {
    align-self: flex-end; background: var(--secondary-bg); color: var(--text);
    border-color: var(--accent);
  }
  .msg.bot {
    align-self: flex-start; background: var(--panel); color: var(--text);
  }
  .msg.typing { opacity: 0.5; font-style: normal; color: var(--hint); }
  .msg img { max-width: 100%; border-radius: 2px; display: block; margin-top: 4px; }
  #inputBar {
    display: flex; gap: 8px; padding: 10px 12px; align-items: flex-end;
    border-top: 1px solid var(--border); background: var(--panel);
  }
  #textInput {
    flex: 1; border: 1px solid var(--border); border-radius: 4px;
    padding: 10px 14px; font-size: 14.5px; background: var(--secondary-bg); color: var(--text);
    outline: none; resize: none;
  }
  #textInput:focus { border-color: var(--accent); }
  #sendBtn {
    background: var(--secondary-bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 0 18px; font-size: 13px; font-weight: 500;
    letter-spacing: 0.04em; text-transform: uppercase;
    cursor: pointer;
  }
  #sendBtn:hover:not(:disabled) { border-color: var(--accent); }
  #sendBtn:disabled { opacity: 0.4; }
  .empty-state {
    text-align: center; color: var(--hint); margin-top: 40px; font-size: 13px; padding: 0 20px;
    letter-spacing: 0.02em;
  }

  /* Боковая панель истории */
  #overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.55);
    display: none; z-index: 5;
  }
  #overlay.open { display: block; }
  #sidebar {
    position: absolute; top: 0; left: 0; bottom: 0; width: 78%; max-width: 300px;
    background: var(--panel); border-right: 1px solid var(--border);
    transform: translateX(-100%); transition: transform 0.2s ease;
    display: flex; flex-direction: column; z-index: 6;
  }
  #sidebar.open { transform: translateX(0); }
  #sidebarHeader {
    padding: 14px 16px; font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    color: var(--hint);
  }
  #newChatBtn {
    background: var(--secondary-bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 9px 12px; font-size: 12px; cursor: pointer; margin: 10px 16px;
    text-transform: uppercase; letter-spacing: 0.04em; font-family: inherit;
  }
  #newChatBtn:hover { border-color: var(--accent); }
  #sessionList { flex: 1; overflow-y: auto; padding: 0 8px; }
  .sessionItem {
    display: flex; align-items: center; gap: 6px;
    padding: 10px 8px; border-radius: 4px; cursor: pointer; margin-bottom: 2px;
    font-size: 13.5px; border: 1px solid transparent;
  }
  .sessionItem:hover, .sessionItem.current { background: var(--secondary-bg); border-color: var(--border); }
  .sessionItem .sTitle {
    flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text);
  }
  .sessionItem .sDelete {
    background: none; border: none; color: var(--hint); font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .sessionItem .sDelete:hover { color: var(--text); }
  .sidebarHint { color: var(--hint); font-size: 11px; padding: 8px 16px 14px; letter-spacing: 0.02em; }
</style>
</head>
<body>
<div id="app">
  <div id="overlay"></div>
  <div id="sidebar">
    <div id="sidebarHeader">
      <span>История чатов</span>
      <button class="iconBtn" id="closeSidebarBtn">✕</button>
    </div>
    <button id="newChatBtn">+ Новый чат</button>
    <div id="sessionList"></div>
    <div class="sidebarHint">Хранятся последние 10 чатов</div>
  </div>

  <div id="header">
    <button class="iconBtn" id="openSidebarBtn">☰</button>
    <div class="headerTitle">JohnnyClub Neuro</div>
    <button class="iconBtn" id="headerNewChatBtn">＋</button>
  </div>

  <div id="messages">
    <div class="empty-state" id="emptyState">Задай любой вопрос — нейросеть ответит прямо здесь.</div>
  </div>

  <div id="inputBar">
    <textarea id="textInput" rows="1" placeholder="Напишите вопрос..."></textarea>
    <button id="sendBtn">→</button>
  </div>
</div>

<script>
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  // ВАЖНО: если фронтенд и бэкенд на одном домене — оставьте пустую строку.
  // Если разместили отдельно, впишите сюда адрес бэкенда, например:
  // const API_URL = 'https://мой-сервер.onrender.com';
  const API_URL = '';

  const GREETING = 'Привет! Я - JohnnyClub Neuro, помогу тебе чем смогу!';
  const STORAGE_KEY = 'johnnyclub_neuro_sessions';
  const MAX_SESSIONS = 10;

  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('textInput');
  const sendBtn = document.getElementById('sendBtn');
  const emptyState = document.getElementById('emptyState');
  const overlay = document.getElementById('overlay');
  const sidebar = document.getElementById('sidebar');
  const openSidebarBtn = document.getElementById('openSidebarBtn');
  const closeSidebarBtn = document.getElementById('closeSidebarBtn');
  const newChatBtn = document.getElementById('newChatBtn');
  const headerNewChatBtn = document.getElementById('headerNewChatBtn');
  const sessionListEl = document.getElementById('sessionList');

  let sessions = loadSessions();       // массив последних 10 чатов
  let currentSessionId = null;

  // ---------- Хранилище (localStorage) ----------
  function loadSessions() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveSessions() {
    // Оставляем только последние 10 чатов
    sessions = sessions
      .sort((a, b) => b.updatedAt - a.updatedAt)
      .slice(0, MAX_SESSIONS);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
  }

  function getCurrentSession() {
    return sessions.find((s) => s.id === currentSessionId);
  }

  function createSession() {
    const session = {
      id: 'chat_' + Date.now(),
      title: 'Новый чат',
      messages: [{ role: 'assistant', content: GREETING }],
      updatedAt: Date.now(),
    };
    sessions.unshift(session);
    saveSessions();
    currentSessionId = session.id;
    renderSessionList();
    renderMessages();
  }

  function switchSession(id) {
    currentSessionId = id;
    renderSessionList();
    renderMessages();
    closeSidebar();
  }

  function deleteSession(id, evt) {
    evt.stopPropagation();
    sessions = sessions.filter((s) => s.id !== id);
    saveSessions();
    if (currentSessionId === id) {
      if (sessions.length > 0) {
        currentSessionId = sessions[0].id;
      } else {
        createSession();
        return;
      }
    }
    renderSessionList();
    renderMessages();
  }

  // ---------- Боковая панель ----------
  function renderSessionList() {
    sessionListEl.innerHTML = '';
    sessions
      .sort((a, b) => b.updatedAt - a.updatedAt)
      .forEach((s) => {
        const item = document.createElement('div');
        item.className = 'sessionItem' + (s.id === currentSessionId ? ' current' : '');
        item.innerHTML =
          '<span class="sTitle"></span><button class="sDelete" title="Удалить">✕</button>';
        item.querySelector('.sTitle').textContent = s.title || 'Новый чат';
        item.addEventListener('click', () => switchSession(s.id));
        item.querySelector('.sDelete').addEventListener('click', (e) => deleteSession(s.id, e));
        sessionListEl.appendChild(item);
      });
  }

  function openSidebar() {
    sidebar.classList.add('open');
    overlay.classList.add('open');
  }
  function closeSidebar() {
    sidebar.classList.remove('open');
    overlay.classList.remove('open');
  }

  openSidebarBtn.addEventListener('click', openSidebar);
  closeSidebarBtn.addEventListener('click', closeSidebar);
  overlay.addEventListener('click', closeSidebar);
  newChatBtn.addEventListener('click', () => { createSession(); closeSidebar(); });
  headerNewChatBtn.addEventListener('click', () => createSession());

  // ---------- Сообщения ----------
  function renderMessages() {
    const session = getCurrentSession();
    messagesEl.innerHTML = '';
    if (!session || session.messages.length === 0) {
      emptyState.style.display = 'block';
      messagesEl.appendChild(emptyState);
      return;
    }
    emptyState.style.display = 'none';
    session.messages.forEach((m) => addMessageEl(m.role, m.content));
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addMessageEl(role, content) {
    const div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
    div.textContent = content;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return div;
  }

  function pushMessage(role, content) {
    const session = getCurrentSession();
    session.messages.push({ role, content });
    session.updatedAt = Date.now();
    if (session.title === 'Новый чат' && role === 'user') {
      session.title = content.slice(0, 30);
    }
    saveSessions();
    renderSessionList();
  }

  // ---------- Отправка ----------
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;

    emptyState.style.display = 'none';
    addMessageEl('user', text);
    pushMessage('user', text);

    await handleChatRequest();

    sendBtn.disabled = false;
  }

  async function handleChatRequest() {
    const session = getCurrentSession();
    const typingEl = addMessageEl('bot', 'печатает...');
    typingEl.classList.add('typing');

    try {
      // На сервер уходит вся история, а сервер сам берёт последние 20 сообщений
      const historyForApi = session.messages
        .map((m) => ({ role: m.role, content: m.content }));

      const res = await fetch(API_URL + '/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: historyForApi }),
      });
      const data = await res.json();

      typingEl.remove();

      if (!res.ok) {
        addMessageEl('bot', 'Ошибка: ' + (data.error || 'что-то пошло не так'));
      } else {
        addMessageEl('bot', data.reply);
        pushMessage('assistant', data.reply);
      }
    } catch (err) {
      typingEl.remove();
      addMessageEl('bot', 'Не удалось связаться с сервером. Проверьте подключение.');
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  // ---------- Инициализация ----------
  (function init() {
    if (sessions.length === 0) {
      createSession();
    } else {
      currentSessionId = sessions.sort((a, b) => b.updatedAt - a.updatedAt)[0].id;
      renderSessionList();
      renderMessages();
    }
  })();
</script>
</body>
</html>
